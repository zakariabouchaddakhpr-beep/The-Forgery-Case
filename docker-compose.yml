# The Forgery Case — whole game in one command:  docker compose up -d
# Editor + game: http://localhost:5678   (game page: http://localhost:5678/webhook/game)
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: forgery
      POSTGRES_PASSWORD: forgery
      POSTGRES_DB: forgery
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./db/plate_notes.sql:/docker-entrypoint-initdb.d/plate_notes.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forgery"]
      interval: 5s
      retries: 10

  n8n:
    image: n8nio/n8n:2.41.4
    ports:
      - "5678:5678"
    environment:
      - GENERIC_TIMEZONE=Europe/Paris
      - N8N_RUNNERS_MODE=external
      - N8N_RUNNERS_BROKER_LISTEN_ADDRESS=0.0.0.0
      - N8N_RUNNERS_AUTH_TOKEN=forgery-runner-secret
      - N8N_NATIVE_PYTHON_RUNNER=true
      # the game page and plates are read from here; nothing else on disk is reachable
      - N8N_RESTRICT_FILE_ACCESS_TO=/files
      - N8N_SECURE_COOKIE=false
    volumes:
      - n8n_data:/home/node/.n8n
      - ./files:/files:ro
      - ./workflows:/workflows:ro
    depends_on:
      postgres:
        condition: service_healthy

  runners:
    image: n8nio/runners:2.41.4
    environment:
      - N8N_RUNNERS_TASK_BROKER_URI=http://n8n:5679
      - N8N_RUNNERS_AUTH_TOKEN=forgery-runner-secret
      - N8N_RUNNERS_STDLIB_ALLOW=json
    depends_on:
      - n8n

volumes:
  n8n_data:
  pg_data:
